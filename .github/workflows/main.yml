# Put this file in your repo at:  .github/workflows/build-apk.yml
# Then: Actions tab -> "Build Android APK" -> Run workflow.
name: Build Android APK

on:
  workflow_dispatch:      # manual "Run workflow" button
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      # Creates the missing Android Gradle files, then restores our manifest
      # (with the photo/video permissions) in case Flutter replaced it.
      - name: Generate Android project files
        run: |
          cp gallery_app/gallery_app/android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          flutter create --platforms=android --org com.customGallery .
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          grep -q READ_MEDIA_IMAGES android/app/src/main/AndroidManifest.xml && echo "Manifest OK"

      # ML Kit and photo_manager need a minimum Android 7.0 (API 24).
      - name: Set minSdk to 24
        run: |
          f=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -n1)
          echo "Patching $f"
          sed -i -E 's/minSdk(Version)?[[:space:]]*=?[[:space:]]*(flutter\.minSdkVersion|[0-9]+)/minSdk = 24/' "$f"
          grep -n "minSdk" "$f"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gallery-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

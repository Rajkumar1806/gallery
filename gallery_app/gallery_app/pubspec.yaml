name: gallery_app
description: A gallery photo app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  photo_manager: ^3.0.0
  permission_handler: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # On-device smart tags + face detection (no cloud)
  google_mlkit_image_labeling: ">=0.13.0 <1.0.0"
  google_mlkit_face_detection: ">=0.12.0 <1.0.0"

  # Places (reverse geocoding of photo GPS)
  geocoding: ^3.0.0

  # Local caches / favourites
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  intl: ">=0.19.0 <1.0.0"

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
